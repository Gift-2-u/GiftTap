name: Deploy Gift Project
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - main
jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Inject RPC into Vercel Build Context
        # This ensures the variable is present in the EXACT file Vercel uses for building
        run: |
          echo "VITE_SOLANA_RPC_URL=${{ secrets.VITE_SOLANA_RPC_URL }}" >> .vercel/.env.production.local
          echo "VITE_SOLANA_RPC_URL=${{ secrets.VITE_SOLANA_RPC_URL }}" >> .env.production

      - name: Build Project Artifacts
        # Vercel Build transforms your JSX into static JS. 
        # The variable MUST be present HERE or it will be 'undefined' forever.
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  supabase-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Wallet Function
        # We point to the subfolder where your supabase folder is
        working-directory: src/components/TapGame
        run: supabase functions deploy create-user-wallet --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}