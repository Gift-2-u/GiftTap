name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/TapGame/supabase/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Wallet Function
        # We use --no-verify-jwt because this is a public-facing auth function
        run: supabase functions deploy create-user-wallet --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}