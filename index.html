<!doctype html>
<html lang="en" class="bg-slate-900">
  <head>
    <!-- Solana Web3 Polyfills (Crucial for Staking Vault) -->
    <script>
      // Must include process.version — readable-stream (via ed25519-hd-key / ripemd160)
      // calls process.version.slice(...) at load; { env: {} } alone blank-screens the app.
      window.global = window;
      window.process = {
        env: {},
        version: 'v18.0.0',
        versions: { node: '18.0.0' },
        browser: true,
      };
    </script>
    <script type="module">
      import { Buffer } from 'buffer';
      window.Buffer = Buffer;
    </script>

    <meta charset="UTF-8" />
    <!-- Gift2U brand icons (not Vite/Vercel default) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="application-name" content="Gift2U" />
    <meta name="apple-mobile-web-app-title" content="Gift2U" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Mobile viewport locks to ensure smooth tapping without zooming -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Monetag: sw.js must be at site root (public/sw.js → /sw.js). Register below. -->

    <title>Gift Tap | GIFT2U</title>
  </head>
  <body class="bg-slate-900 text-white overflow-x-hidden antialiased m-0 p-0">
    <div id="root" class="min-h-screen w-full flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Monetag service worker (required for site verification / some ad formats) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (reg) {
              console.log('Monetag SW registered:', reg.scope);
            })
            .catch(function (err) {
              console.warn('Monetag SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
