[toolchain]
anchor_version = "0.30.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.mainnet]
gift_staking = "CX5aqenEeWvfwvhF8Xek8Dd6sVPn8uHRhXafbKQvUAxy"

# Keep devnet id for local/test deploys if you still need it
[programs.devnet]
gift_staking = "CX5aqenEeWvfwvhF8Xek8Dd6sVPn8uHRhXafbKQvUAxy"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
